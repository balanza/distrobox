name: CLI Smoke Tests

# Runs the Go-based CLI smoke suite under tests/cli/ for both supported
# container managers (podman and docker). The suite builds the distrobox
# binary, then exercises each subcommand inside a privileged podman-in-
# podman / docker-in-docker test host.

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
    types: [opened, synchronize, ready_for_review, edited]
  workflow_dispatch:

jobs:
  test-cli:
    name: ${{ matrix.container_manager }} CLI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        container_manager: [podman, docker]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # The runner already has docker; install podman so TEST_ENGINE has a
      # choice. tests/cli/run.sh prefers podman when both are present, so
      # this also makes the outer engine consistent across matrix legs.
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run CLI tests
        env:
          # Force the outer container engine to docker on GitHub runners —
          # rootless podman occasionally has trouble with the runner's
          # cgroup v2 setup and docker is always installed by default.
          TEST_ENGINE: docker
        run: make test-cli CONTAINER_MANAGER=${{ matrix.container_manager }}
