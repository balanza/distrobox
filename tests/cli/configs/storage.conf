# storage.conf overrides for podman-in-podman test runs.
#
# The default driver "overlay" cannot mount overlayfs on top of overlayfs,
# which is the layout we get when the per-test HOME (set via XDG_DATA_HOME)
# lives on the layered test-host image's rootfs. The fix is to route mounts
# through fuse-overlayfs (already present in quay.io/podman/stable), which
# tolerates overlay-on-overlayfs.
#
# We deliberately leave `runroot` and `graphroot` unset so each invocation
# still uses the rootless default ($XDG_DATA_HOME/containers/storage). The
# harness sets CONTAINERS_STORAGE_CONF=/etc/containers/storage.conf so this
# file takes effect even when XDG_CONFIG_HOME points at an empty per-test
# directory (which would otherwise cause podman to fall back to built-in
# defaults instead of reading the system storage.conf).

[storage]
driver = "overlay"

[storage.options]
# Share the entrypoint's pre-pulled image cache (rooted at the podman user's
# default XDG data dir) so per-test podman invocations do not re-pull the
# smoke image. This both cuts test runtime drastically and hides the
# occasional Cloudflare R2 TLS hiccup that flakes the suite.
additionalimagestores = ["/home/podman/.local/share/containers/storage"]

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,metacopy=on"
