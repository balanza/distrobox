# containers.conf overrides for podman-in-podman test runs.
#
# The upstream image ships with utsns="host" and cgroups="disabled", both
# of which break our nested case:
#   - utsns="host" prevents the inner podman from setting a hostname on
#     child containers (distrobox sets --hostname unconditionally).
#   - cgroups="disabled" conflicts with distrobox's default --pid host: when
#     cgroup management is off, podman requires a private PID namespace.
#     We run --privileged anyway, so the test host has full cgroup access
#     and re-enabling cgroup management is safe.
# Everything else is left as the image ships it.

[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "private"
cgroupns = "host"
cgroups = "enabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
